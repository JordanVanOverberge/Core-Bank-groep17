<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PingFin — Inloggen</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:           #F5F7FB;
      --surface:      #FFFFFF;
      --surface2:     #F8FAFC;
      --border:       #E2E8F0;
      --border2:      #CBD5E1;
      --accent:       #7C3AED;
      --accent-light: #EDE9FE;
      --accent-dark:  #6D28D9;
      --red:          #DC2626;
      --red-light:    #FEE2E2;
      --text:         #0F172A;
      --text2:        #475569;
      --text3:        #94A3B8;
      --mono: 'Space Mono', monospace;
      --sans: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: '';
      position: fixed;
      top: -120px; right: -120px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(124,58,237,0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -100px; left: -100px;
      width: 360px; height: 360px;
      background: radial-gradient(circle, rgba(124,58,237,0.05) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
      padding: 44px 40px 36px;
      width: 100%;
      max-width: 400px;
      position: relative;
      z-index: 1;
    }

    .card::before {
      content: '';
      position: absolute; top: 0; left: 24px; right: 24px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      border-radius: 2px;
    }

    .logo {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 6px;
    }
    .logo-mark {
      width: 38px; height: 38px;
      background: var(--accent);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 12px; font-weight: 700;
      color: #fff; letter-spacing: -0.05em; flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(124,58,237,0.3);
    }
    .logo-name {
      font-family: var(--mono); font-size: 16px; font-weight: 700;
      color: var(--text); letter-spacing: 0.08em;
    }

    .subtitle {
      font-size: 13px; color: var(--text3);
      margin-bottom: 28px;
    }

    .divider { height: 1px; background: var(--border); margin-bottom: 28px; }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--text2);
      margin-bottom: 6px;
    }

    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--text3); pointer-events: none;
    }
    .input-icon svg { width: 15px; height: 15px; display: block; }

    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px 10px 38px;
      font-size: 14px; color: var(--text);
      background: var(--surface2);
      font-family: var(--sans);
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(124,58,237,0.12);
    }
    input::placeholder { color: var(--text3); }

    .eye-btn {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--text3); padding: 4px; transition: color 0.15s;
    }
    .eye-btn:hover { color: var(--accent); }
    .eye-btn svg { width: 15px; height: 15px; display: block; }

    .btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 14px; font-weight: 600;
      cursor: pointer;
      font-family: var(--sans);
      transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
      margin-top: 8px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:hover {
      background: var(--accent-dark);
      box-shadow: 0 6px 16px rgba(124,58,237,0.30);
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn svg { width: 15px; height: 15px; flex-shrink: 0; }

    .error {
      display: none;
      align-items: center; gap: 8px;
      background: var(--red-light);
      border: 1px solid #FECACA;
      color: var(--red);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-top: 12px;
    }
    .error.visible { display: flex; }
    .error svg { width: 15px; height: 15px; flex-shrink: 0; }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 11px; color: var(--text3);
      font-family: var(--mono);
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-mark">PF</div>
      <span class="logo-name">PINGFIN</span>
    </div>
    <div class="subtitle">GKCCBEBB &mdash; Admin Dashboard</div>

    <div class="divider"></div>

    <form onsubmit="doLogin(event)">
      <div class="form-group">
        <label for="username">Gebruikersnaam</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </span>
          <input id="username" type="text" autocomplete="username" placeholder="admin"/>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Wachtwoord</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
          </span>
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••"/>
          <button type="button" class="eye-btn" onclick="togglePass()" title="Toon/verberg wachtwoord">
            <svg id="eyeIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn" id="loginBtn">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
        </svg>
        Inloggen
      </button>

      <div class="error" id="errorMsg">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span id="errorText">Ongeldige gebruikersnaam of wachtwoord.</span>
      </div>
    </form>

    <div class="footer">GKCCBEBB &nbsp;&middot;&nbsp; Internationale Week 2026</div>
  </div>

  <script>
    if (localStorage.getItem('token')) window.location.href = '/';

    document.getElementById('username').value = 'admin';
    document.getElementById('password').value = 'Pingfin2026!';

    function togglePass() {
      const input = document.getElementById('password');
      const icon  = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>`;
      } else {
        input.type = 'password';
        icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>`;
      }
    }

    async function doLogin(e) {
      e.preventDefault();
      const btn  = document.getElementById('loginBtn');
      const err  = document.getElementById('errorMsg');
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;

      err.classList.remove('visible');
      btn.disabled = true;
      btn.innerHTML = `<svg style="animation:spin .7s linear infinite" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="15" height="15"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg> Bezig...`;

      try {
        const res  = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass }),
        });
        const json = await res.json();
        if (json.ok && json.data && json.data.token) {
          localStorage.setItem('token', json.data.token);
          window.location.href = '/';
        } else {
          document.getElementById('errorText').textContent = 'Ongeldige gebruikersnaam of wachtwoord.';
          err.classList.add('visible');
          resetBtn();
        }
      } catch (ex) {
        document.getElementById('errorText').textContent = 'Server niet bereikbaar.';
        err.classList.add('visible');
        resetBtn();
      }
    }

    function resetBtn() {
      const btn = document.getElementById('loginBtn');
      btn.disabled = false;
      btn.innerHTML = `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="15" height="15"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg> Inloggen`;
    }
  </script>
</body>
</html>
